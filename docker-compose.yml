services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${STOCKLY_ACCEPT_EULA:?Set STOCKLY_ACCEPT_EULA after accepting the SQL Server image EULA locally}
      MSSQL_PID: ${STOCKLY_MSSQL_PID:?Set STOCKLY_MSSQL_PID for this local reference deployment}
      MSSQL_SA_PASSWORD: ${STOCKLY_SA_PASSWORD:?Set STOCKLY_SA_PASSWORD in the git-ignored local environment}
      TZ: UTC
    volumes:
      - db-data:/var/opt/mssql
    networks:
      - stockly_internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__StocklyDb: ${STOCKLY_APP_CONNECTION_STRING:?Set STOCKLY_APP_CONNECTION_STRING in the git-ignored local environment}
      Database__AutoMigrateOnStartup: "false"
      TZ: UTC
    volumes:
      - app-files:/var/stockly/files
    networks:
      - stockly_internal
    depends_on:
      sqlserver:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - stockly_internal
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - .:/src
      - nuget-cache:/root/.nuget/packages
    environment:
      STOCKLY_MIGRATION_CONNECTION_STRING: ${STOCKLY_MIGRATION_CONNECTION_STRING:?Set STOCKLY_MIGRATION_CONNECTION_STRING in the git-ignored local environment}
    networks:
      - stockly_internal
    depends_on:
      sqlserver:
        condition: service_healthy
    profiles:
      - migrate
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        dotnet tool restore
        dotnet ef database update --project src/Stockly.Infrastructure --startup-project src/Stockly.Infrastructure --connection "$$STOCKLY_MIGRATION_CONNECTION_STRING"

volumes:
  db-data:
  app-files:
  nuget-cache:

networks:
  stockly_internal:
    driver: bridge
